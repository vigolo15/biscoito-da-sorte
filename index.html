<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biscoito da Sorte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>🥠 Biscoito da Sorte</h1>

    <p class="subtitle">
      Que mensagem o destino reservou para você?
    </p>

    <div class="cookie-area">
      <div class="cookie" id="cookie" title="Clique no biscoito">
        <span class="cookie-left"></span>
        <span class="cookie-right"></span>
      </div>
    </div>

    <button id="fortuneButton">
      Quebrar o biscoito
    </button>

    <div class="message-box" id="messageBox">
      <p id="message">
        Sua mensagem aparecerá aqui...
      </p>
    </div>

    <p class="counter" id="counter">
      Mensagens reveladas: 0
    </p>
  </main>

  <script src="main.js"></script>
</body>
</html>
